# =============================================================
#  Order Service – Configuration Spring Boot
#  Auteur : Yessine
# =============================================================
server:
  port: ${ORDER_SERVICE_PORT:8081}

spring:
  application:
    name: order-service


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:order_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool de connexions optimisé pour un microservice
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    defer-datasource-initialization: true
    hibernate:
      # validate : vérifie le schéma sans le modifier (prod)
      # update  : met à jour le schéma automatiquement (dev)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql: # <-- NEW block, same level as "jpa:"
    init:
      mode: always

  # Fix: spring-boot-starter-web-services auto-registers a MessageDispatcherServlet
  # at "/*" which hijacks all REST routes. We redirect it to a dead path so that
  # Spring MVC DispatcherServlet handles /api/** normally.
  webservices:
    path: /soap-client-disabled
carrier:
  soap:
    url: ${CARRIER_SOAP_URL:http://localhost:8082/ws}
    connect-timeout-ms: ${CARRIER_SOAP_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${CARRIER_SOAP_READ_TIMEOUT_MS:3000}

grpc:
  client:
    tracking-service:
      address: ${TRACKING_GRPC_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext

tracking:
  grpc:
    deadline-ms: ${TRACKING_GRPC_DEADLINE_MS:2000}

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.parcelflow: DEBUG
    org.springframework.web: INFO
