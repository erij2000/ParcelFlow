# =============================================================
#  Order Service – Configuration Spring Boot
#  Auteur : Yessine
# =============================================================
server:
  port: ${ORDER_SERVICE_PORT:8081}

spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/orderdb}
    username: ${SPRING_DATASOURCE_USERNAME:order_user}
    password: ${SPRING_DATASOURCE_PASSWORD:order_pass_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pool de connexions optimisé pour un microservice
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # validate : vérifie le schéma sans le modifier (prod)
      # update  : met à jour le schéma automatiquement (dev)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.parcelflow: DEBUG
    org.springframework.web: INFO
