# =============================================================
#  Carrier Service – Configuration Spring Boot
#  Auteur : Malek
# =============================================================
server:
  port: ${CARRIER_SERVICE_PORT:8082}

spring:
  application:
    name: carrier-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/carrierdb}
    username: ${SPRING_DATASOURCE_USERNAME:carrier_user}
    password: ${SPRING_DATASOURCE_PASSWORD:carrier_pass_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.parcelflow: DEBUG
    org.springframework.ws: DEBUG
